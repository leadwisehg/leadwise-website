<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadwise AI — Pipeline, engineered from signal.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0a0a0b;
  --bg-2: #0e0e10;
  --fg: #f2f2f0;
  --fg-dim: rgba(242,242,240,0.56);
  --fg-faint: rgba(242,242,240,0.32);
  --fg-ghost: rgba(242,242,240,0.14);
  --line: rgba(242,242,240,0.14);
  --line-strong: rgba(242,242,240,0.24);
  --accent: #ba8b8e;
  --accent-dim: rgba(186,139,142,0.35);
  --accent-faint: rgba(186,139,142,0.14);
  --grain: 0.045;
  --scanline: 0.035;
  --dotgrid: 0.06;
  --f-display: "Space Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body: "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono: "JetBrains Mono","IBM Plex Mono","Space Mono",ui-monospace,monospace;
  --container: 1440px;
  --pad-x: clamp(24px,4vw,64px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.tex-grain,.tex-scan,.tex-dots{position:fixed;inset:0;pointer-events:none;z-index:1;}
.tex-grain{opacity:var(--grain);mix-blend-mode:overlay;}
.tex-scan{background:repeating-linear-gradient(to bottom,rgba(255,255,255,var(--scanline)) 0px,rgba(255,255,255,var(--scanline)) 1px,transparent 1px,transparent 3px);}
.tex-dots{background-image:radial-gradient(rgba(255,255,255,var(--dotgrid)) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,black,black 60%,transparent);-webkit-mask-image:linear-gradient(to bottom,black,black 60%,transparent);}
.tex-vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(0,0,0,0.45) 100%);}
.app-root{position:relative;z-index:3;}

.mono{font-family:var(--f-mono);}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-dim);}
.label-accent{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
.hint{font-family:var(--f-mono);font-size:10px;letter-spacing:0.12em;color:var(--fg-faint);text-transform:uppercase;}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:300;letter-spacing:-0.02em;margin:0;color:var(--fg);}
h1{font-size:clamp(56px,8.5vw,136px);line-height:0.94;letter-spacing:-0.035em;}
h2{font-size:clamp(40px,5.2vw,84px);line-height:0.98;letter-spacing:-0.03em;}
h3{font-size:clamp(22px,2vw,30px);line-height:1.15;}
p{margin:0;color:var(--fg-dim);}
.lead{font-size:17px;color:rgba(242,242,240,0.72);line-height:1.5;max-width:58ch;}

.container{max-width:var(--container);margin:0 auto;padding:0 var(--pad-x);}

.frame{position:relative;border:1px solid var(--line);}
.crop-tl,.crop-tr,.crop-bl,.crop-br{position:absolute;width:14px;height:14px;border-color:var(--accent);pointer-events:none;}
.crop-tl{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);transform:translate(-6px,-6px);}
.crop-tr{top:-1px;right:-1px;border-top:1px solid var(--accent);border-right:1px solid var(--accent);transform:translate(6px,-6px);}
.crop-bl{bottom:-1px;left:-1px;border-bottom:1px solid var(--accent);border-left:1px solid var(--accent);transform:translate(-6px,6px);}
.crop-br{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);transform:translate(6px,6px);}

.section{position:relative;padding:clamp(80px,10vw,160px) 0;border-top:1px solid var(--line);}
.section-label{display:flex;align-items:center;gap:12px;margin-bottom:48px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.section-label .tick{flex:1;height:1px;background:var(--line);}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);font-family:var(--f-mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:all 180ms ease;position:relative;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn .arrow{transition:transform 180ms ease;}
.btn:hover .arrow{transform:translateX(4px);}
.btn-primary{border-color:var(--accent);color:var(--accent);}
.btn-primary:hover{background:var(--accent-faint);}
.btn-ghost{border:none;padding:14px 0;color:var(--fg-dim);}
.btn-ghost:hover{color:var(--accent);border:none;}

.target{width:10px;height:10px;border:1px solid var(--accent);position:relative;display:inline-block;}
.target::before,.target::after{content:"";position:absolute;background:var(--accent);}
.target::before{left:50%;top:-3px;bottom:-3px;width:1px;transform:translateX(-50%);}
.target::after{top:50%;left:-3px;right:-3px;height:1px;transform:translateY(-50%);}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:2px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.06em;color:var(--fg-dim);}
.pill .pd{width:5px;height:5px;border-radius:50%;}
.pill-hot{border-color:rgba(186,139,142,0.5);color:var(--accent);}
.pill-hot .pd{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.pill-warm{border-color:rgba(214,174,150,0.4);color:#d6ae96;}
.pill-warm .pd{background:#d6ae96;}
.pill-cold{border-color:rgba(150,170,190,0.3);color:#96aabe;}
.pill-cold .pd{background:#96aabe;}

.hairline{height:1px;background:var(--line);width:100%;}
.vrule{width:1px;background:var(--line);align-self:stretch;}

@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.rise{animation:rise 700ms cubic-bezier(.2,.7,.2,1) both;}
@keyframes blink{0%,55%{opacity:1;}56%,100%{opacity:0.25;}}
.blink{animation:blink 1.6s infinite;}
@keyframes marq{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.marquee{display:flex;gap:20px;white-space:nowrap;animation:marq 25s linear infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}  }

.feed-row{transition:background 160ms ease;}
.feed-row:hover{background:rgba(186,139,142,0.05);}
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{scrollbar-width:none;}

.flex{display:flex;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}.gap-3{gap:12px;}.gap-4{gap:16px;}.gap-6{gap:24px;}.gap-8{gap:32px;}
.grid{display:grid;}.full{width:100%;}.relative{position:relative;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid var(--line);background:rgba(10,10,11,0.85);backdrop-filter:blur(12px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 var(--pad-x);}
.nav-logo{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-0.02em;cursor:pointer;}
.nav-logo span{color:var(--accent);}
.nav-links{display:flex;align-items:center;gap:32px;}
.nav-link{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-dim);cursor:pointer;transition:color 160ms;}
.nav-link:hover,.nav-link.active{color:var(--fg);}
.nav-cta{font-family:var(--f-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;transition:all 160ms;}
.nav-cta:hover{background:var(--accent-faint);}
@media(max-width:768px){.nav-links{display:none;}}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad-x);padding-bottom:clamp(48px,6vw,96px);padding-top:100px;}
.hero-eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:32px;}
.hero-h1{margin-bottom:40px;}
.hero-sub{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:flex-end;}
.hero-stats{display:flex;gap:48px;margin-top:48px;}
.hero-stat-val{font-family:var(--f-display);font-size:clamp(28px,3.5vw,52px);font-weight:300;letter-spacing:-0.04em;color:var(--fg);}
.hero-stat-lab{font-family:var(--f-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-faint);margin-top:4px;}
.hero-grid-line{position:absolute;background:var(--line);}

/* Ticker */
.ticker-wrap{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;}
.ticker-inner{display:flex;gap:0;white-space:nowrap;}
.ticker-track{display:flex;gap:40px;animation:marq 30s linear infinite;}
.ticker-item{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-faint);}
.ticker-sep{color:var(--accent);margin:0 4px;}

/* LOGO STRIP */
.logo-strip{padding:clamp(32px,4vw,56px) 0;border-top:1px solid var(--line);}
.logo-strip-label{text-align:center;margin-bottom:32px;}
.logo-grid{display:flex;align-items:center;justify-content:center;gap:clamp(32px,4vw,64px);flex-wrap:wrap;}
.logo-item{font-family:var(--f-display);font-size:clamp(13px,1.5vw,17px);font-weight:500;letter-spacing:-0.01em;color:var(--fg-faint);transition:color 200ms;}
.logo-item:hover{color:var(--fg-dim);}

/* APPROACH */
.approach-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);}
@media(max-width:768px){.approach-grid{grid-template-columns:1fr;}}
.approach-card{background:var(--bg);padding:clamp(32px,3vw,48px);position:relative;}
.approach-num{font-family:var(--f-mono);font-size:11px;letter-spacing:0.1em;color:var(--accent);margin-bottom:24px;}
.approach-title{font-family:var(--f-display);font-size:clamp(18px,1.8vw,24px);font-weight:400;letter-spacing:-0.02em;margin-bottom:12px;}
.approach-desc{font-size:14px;color:var(--fg-dim);line-height:1.6;}

/* HOW IT WORKS */
.hiw-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
@media(max-width:768px){.hiw-steps{grid-template-columns:1fr;}}
.hiw-step{background:var(--bg);padding:clamp(32px,3vw,48px);}
.hiw-step-n{font-family:var(--f-mono);font-size:48px;font-weight:400;color:var(--fg-ghost);line-height:1;margin-bottom:24px;}
.hiw-step-title{font-family:var(--f-display);font-size:clamp(18px,1.6vw,22px);font-weight:400;margin-bottom:12px;letter-spacing:-0.02em;}
.hiw-step-desc{font-size:14px;color:var(--fg-dim);line-height:1.6;}

/* ICP */
.icp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);}
.icp-card{background:var(--bg);padding:32px;transition:background 180ms;}
.icp-card:hover{background:var(--bg-2);}
.icp-icon{width:36px;height:36px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:16px;}
.icp-title{font-family:var(--f-display);font-size:17px;font-weight:500;letter-spacing:-0.01em;margin-bottom:8px;}
.icp-desc{font-size:13px;color:var(--fg-dim);line-height:1.55;}

/* WORKFLOW */
.wf-line{display:grid;grid-template-columns:120px 1fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start;}
.wf-line:last-child{border-bottom:none;}
.wf-stage{font-family:var(--f-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);padding-top:3px;}
.wf-detail{font-size:14px;color:var(--fg-dim);line-height:1.6;}
.wf-detail strong{color:var(--fg);font-weight:500;}

/* METHOD */
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
@media(max-width:900px){.method-grid{grid-template-columns:1fr;gap:48px;}}
.method-list{display:flex;flex-direction:column;gap:0;}
.method-item{padding:20px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;}
.method-item:first-child{border-top:1px solid var(--line);}
.method-check{width:18px;height:18px;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:10px;color:var(--accent);}
.method-text{font-size:14px;color:var(--fg-dim);line-height:1.6;}
.method-text strong{color:var(--fg);font-weight:500;}

/* WHY */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
@media(max-width:768px){.why-grid{grid-template-columns:1fr;}}
.why-card{background:var(--bg);padding:clamp(28px,3vw,44px);}
.why-val{font-family:var(--f-display);font-size:clamp(36px,4vw,64px);font-weight:300;letter-spacing:-0.04em;color:var(--fg);line-height:1;}
.why-unit{font-family:var(--f-mono);font-size:12px;letter-spacing:0.1em;color:var(--accent);margin-left:4px;}
.why-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-faint);margin-top:8px;}
.why-desc{font-size:13px;color:var(--fg-dim);margin-top:12px;line-height:1.55;}

/* FAQ */
.faq-item{border-bottom:1px solid var(--line);}
.faq-q{width:100%;background:none;border:none;color:var(--fg);font-family:var(--f-display);font-size:clamp(16px,1.5vw,20px);font-weight:400;letter-spacing:-0.02em;text-align:left;padding:24px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;}
.faq-q:hover{color:var(--accent);}
.faq-icon{font-family:var(--f-mono);font-size:18px;color:var(--accent);flex-shrink:0;transition:transform 200ms;}
.faq-icon.open{transform:rotate(45deg);}
.faq-a{font-size:14px;color:var(--fg-dim);line-height:1.7;padding-bottom:24px;max-width:72ch;}

/* LIVE PROSPECTS */
.lp-table{width:100%;border-collapse:collapse;}
.lp-th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-faint);padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;}
.lp-td{font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--fg-dim);vertical-align:middle;}
.lp-td.name{color:var(--fg);font-weight:500;}
.score-bar{height:3px;background:var(--fg-ghost);border-radius:2px;overflow:hidden;width:80px;}
.score-fill{height:100%;background:var(--accent);border-radius:2px;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--fg-faint);border-radius:2px;cursor:pointer;transition:all 150ms;}
.cal-day.has-slot{border:1px solid var(--line-strong);color:var(--fg-dim);}
.cal-day.has-slot:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-faint);}
.cal-day.selected{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.cal-day.today{outline:1px solid var(--fg-faint);outline-offset:2px;}
.cal-day.empty{pointer-events:none;}

/* OUTBOUND PANEL */
.signal-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.signal-row:last-child{border-bottom:none;}
.signal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.signal-body{flex:1;min-width:0;}
.signal-company{font-size:13px;color:var(--fg);font-weight:500;margin-bottom:2px;}
.signal-detail{font-size:12px;color:var(--fg-dim);line-height:1.4;}
.signal-time{font-family:var(--f-mono);font-size:10px;color:var(--fg-faint);flex-shrink:0;}

/* STACK PAGE */
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--line);}
.stack-card{background:var(--bg);padding:36px;position:relative;}
.stack-card-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
.stack-card-title{font-family:var(--f-display);font-size:clamp(18px,1.8vw,22px);font-weight:400;letter-spacing:-0.02em;margin-bottom:10px;}
.stack-card-desc{font-size:13px;color:var(--fg-dim);line-height:1.6;}
.stack-tag{display:inline-flex;padding:2px 7px;border:1px solid var(--line);font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.08em;color:var(--fg-faint);margin-top:16px;margin-right:4px;}

/* SIGNALS PAGE */
.sig-source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--line);}
.sig-source{background:var(--bg);padding:28px;transition:background 160ms;}
.sig-source:hover{background:var(--bg-2);}
.sig-source-name{font-family:var(--f-display);font-size:16px;font-weight:500;letter-spacing:-0.01em;margin-bottom:6px;}
.sig-source-desc{font-size:12px;color:var(--fg-dim);line-height:1.55;}
.sig-type-badge{display:inline-flex;padding:2px 7px;border-radius:2px;font-family:var(--f-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;}
.sig-type-intent{border:1px solid rgba(186,139,142,0.4);color:var(--accent);}
.sig-type-firmographic{border:1px solid rgba(150,170,190,0.3);color:#96aabe;}
.sig-type-behavioral{border:1px solid rgba(214,174,150,0.4);color:#d6ae96;}
.sig-type-technographic{border:1px solid rgba(140,186,164,0.4);color:#8ebaa4;}

/* INTEL PAGE */
.intel-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-bottom:1px;}
@media(max-width:768px){.intel-stat-row{grid-template-columns:repeat(2,1fr);}}
.intel-stat{background:var(--bg);padding:clamp(20px,2vw,32px);}

/* ABOUT */
.about-vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);}
.about-val{background:var(--bg);padding:32px;}
.about-val-title{font-family:var(--f-display);font-size:18px;font-weight:500;letter-spacing:-0.01em;margin-bottom:8px;}
.about-val-desc{font-size:13px;color:var(--fg-dim);line-height:1.6;}

/* CONTACT */
.contact-form{display:flex;flex-direction:column;gap:20px;max-width:520px;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-label{font-family:var(--f-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-faint);}
.form-input{background:transparent;border:1px solid var(--line-strong);color:var(--fg);font-family:var(--f-body);font-size:14px;padding:12px 14px;outline:none;transition:border-color 160ms;width:100%;}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:var(--fg-ghost);}
textarea.form-input{resize:vertical;min-height:100px;}
select.form-input{appearance:none;cursor:pointer;}

/* FOOTER */
.footer{padding:clamp(48px,6vw,96px) 0 clamp(32px,3vw,48px);border-top:1px solid var(--line);}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.footer-grid{grid-template-columns:1fr;}}
.footer-brand{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-0.03em;margin-bottom:12px;}
.footer-brand span{color:var(--accent);}
.footer-tagline{font-size:13px;color:var(--fg-dim);max-width:28ch;line-height:1.55;}
.footer-col-title{font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:16px;}
.footer-link{display:block;font-size:13px;color:var(--fg-dim);margin-bottom:10px;cursor:pointer;transition:color 160ms;}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ─── UTILITIES ───────────────────────────────────────────────────────────────

function Frame({ children, style, className="" }) {
  return (
    <div className={"frame " + className} style={style}>
      <div className="crop-tl"/><div className="crop-tr"/>
      <div className="crop-bl"/><div className="crop-br"/>
      {children}
    </div>
  );
}

function SectionLabel({ text, index }) {
  return (
    <div className="section-label">
      <div className="dot"/>
      <span className="label">{index && <span style={{color:"var(--accent)",marginRight:8}}>{index}</span>}{text}</span>
      <div className="tick"/>
    </div>
  );
}

function Btn({ children, primary, ghost, onClick, style }) {
  return (
    <button className={`btn${primary?" btn-primary":""}${ghost?" btn-ghost":""}`} onClick={onClick} style={style}>
      {children}
      {!ghost && <span className="arrow">→</span>}
    </button>
  );
}

function Pill({ label, type="cold" }) {
  return (
    <span className={`pill pill-${type}`}>
      <span className="pd"/>
      {label}
    </span>
  );
}

function useFadeIn() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add("visible"); obs.disconnect(); }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

// ─── TWEAKS ──────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = { accent:"#ba8b8e", grain:0.045, scanline:0.035, dotgrid:0.06 };
const ACCENT_PRESETS = [
  { label:"Blush", v:"#ba8b8e" },
  { label:"Sand",  v:"#c9b28a" },
  { label:"Mint",  v:"#8ebaa4" },
  { label:"Sky",   v:"#8ea6ba" },
  { label:"Amber", v:"#c9a26a" },
];

function useTweaks(defaults) {
  const [t, setT] = useState(defaults);
  const set = (k,v) => setT(p => ({...p,[k]:v}));
  return [t, set];
}

function TweaksPanel({ t, set }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="tweaks-panel">
      <div className="tweaks-header" onClick={() => setOpen(p=>!p)}>
        <span className="tweaks-title">⚙ Tweaks</span>
        <button className="tweaks-toggle">{open?"▲":"▼"}</button>
      </div>
      {open && (
        <>
          <div className="tweak-section">Accent</div>
          <div className="accent-swatches">
            {ACCENT_PRESETS.map(p => (
              <div key={p.v} className={"accent-swatch" + (t.accent===p.v?" active":"")}
                style={{background:p.v}} onClick={() => set("accent",p.v)} title={p.label}/>
            ))}
          </div>
          <div className="form-field" style={{marginBottom:8}}>
            <input type="color" value={t.accent} onChange={e=>set("accent",e.target.value)}
              style={{width:"100%",height:24,border:"1px solid var(--line-strong)",background:"none",cursor:"pointer"}}/>
          </div>
          <div className="tweak-section">Texture</div>
          {[["Grain","grain",0,0.15,0.005],["Scanlines","scanline",0,0.12,0.005],["Dot grid","dotgrid",0,0.18,0.005]].map(([l,k,mn,mx,st]) => (
            <div key={k}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span className="tweak-label">{l}</span>
                <span className="tweak-label">{t[k].toFixed(3)}</span>
              </div>
              <input type="range" className="tweak-slider" min={mn} max={mx} step={st}
                value={t[k]} onChange={e=>set(k,parseFloat(e.target.value))}/>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ─── QUALIFIED CALENDAR ──────────────────────────────────────────────────────

const DAYS_OF_WEEK = ["M","T","W","T","F","S","S"];
const SLOTS = [3,5,8,10,12,15,17,19,22,24,26,28];
const TIMES = ["09:00","09:30","10:00","10:30","11:00","14:00","14:30","15:00"];

function QualifiedCalendar() {
  const [selectedDay, setSelectedDay] = useState(15);
  const [selectedTime, setSelectedTime] = useState("10:00");
  const [submitted, setSubmitted] = useState(false);
  const ref = useFadeIn();

  return (
    <section className="section">
      <div className="container">
        <SectionLabel text="Book a qualified intro" index="03"/>
        <div ref={ref} className="fade-in" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1px",background:"var(--line)"}}>
          <div style={{background:"var(--bg)",padding:"clamp(32px,4vw,56px)"}}>
            <p className="label-accent" style={{marginBottom:8}}>May 2026</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:16}}>
              {DAYS_OF_WEEK.map((d,i) => (
                <div key={i} style={{textAlign:"center",fontFamily:"var(--f-mono)",fontSize:9,letterSpacing:"0.1em",color:"var(--fg-faint)",padding:"4px 0"}}>{d}</div>
              ))}
            </div>
            <div className="cal-grid">
              {[...Array(35)].map((_,i) => {
                const day = i - 3; // May 2026 starts on Friday
                if (day < 1 || day > 31) return <div key={i} className="cal-day empty"/>;
                const hasSlot = SLOTS.includes(day);
                const isSelected = day === selectedDay;
                return (
                  <div key={i}
                    className={"cal-day"+(hasSlot?" has-slot":"")+(isSelected?" selected":"")+(day===7?" today":"")}
                    onClick={() => hasSlot && setSelectedDay(day)}>
                    {day}
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:24}}>
              <p className="hint" style={{marginBottom:12}}>Available times — Day {selectedDay}</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {TIMES.map(t => (
                  <button key={t} onClick={() => setSelectedTime(t)}
                    style={{
                      fontFamily:"var(--f-mono)",fontSize:11,letterSpacing:"0.1em",
                      padding:"6px 12px",border:"1px solid",cursor:"pointer",background:"transparent",
                      borderColor: t===selectedTime ? "var(--accent)":"var(--line-strong)",
                      color: t===selectedTime ? "var(--accent)":"var(--fg-dim)",
                      transition:"all 150ms"
                    }}>
                    {t}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div style={{background:"var(--bg)",padding:"clamp(32px,4vw,56px)"}}>
            <h3 style={{marginBottom:12}}>30-min pipeline review</h3>
            <p style={{fontSize:14,color:"var(--fg-dim)",marginBottom:32,lineHeight:1.65}}>
              We'll audit your current outbound motion, identify the highest-signal accounts in your market right now, and show you exactly how Leadwise would accelerate your pipeline.
            </p>
            {submitted ? (
              <div style={{padding:24,border:"1px solid var(--accent)",background:"var(--accent-faint)"}}>
                <p className="label-accent" style={{marginBottom:8}}>✓ Confirmed</p>
                <p style={{fontSize:14,color:"var(--fg-dim)"}}>May {selectedDay} at {selectedTime} — you'll receive a calendar invite shortly.</p>
              </div>
            ) : (
              <div className="contact-form">
                <div className="form-field">
                  <label className="form-label">Full name</label>
                  <input className="form-input" type="text" placeholder="Alex Chen"/>
                </div>
                <div className="form-field">
                  <label className="form-label">Work email</label>
                  <input className="form-input" type="email" placeholder="alex@company.com"/>
                </div>
                <div className="form-field">
                  <label className="form-label">Company</label>
                  <input className="form-input" type="text" placeholder="Acme Corp"/>
                </div>
                <div style={{padding:"12px 16px",border:"1px solid var(--line-strong)",background:"var(--bg-2)"}}>
                  <p className="hint">Selected</p>
                  <p style={{fontFamily:"var(--f-mono)",fontSize:13,color:"var(--fg)",marginTop:4}}>
                    May {selectedDay}, 2026 · {selectedTime}
                  </p>
                </div>
                <Btn primary onClick={() => setSubmitted(true)}>Confirm booking</Btn>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState("home");
  const [t, set] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--accent", t.accent);
    r.style.setProperty("--accent-dim", t.accent + "59");
    r.style.setProperty("--accent-faint", t.accent + "24");
    r.style.setProperty("--grain", String(t.grain));
    r.style.setProperty("--scanline", String(t.scanline));
    r.style.setProperty("--dotgrid", String(t.dotgrid));
  }, [t]);

  const onNav = (p) => {
    setPage(p);
    window.scrollTo({ top:0, behavior:"instant" });
  };

  return (
    <>
      <Nav page={page} onNav={onNav} />
      {page === "home" && <>
        <Hero onNav={onNav}/>
        <Ticker/>
        <Approach/>
        <LogoStrip/>
        <HowItWorks/>
        <QualifiedCalendar/>
        <ICPSection/>
        <Workflow/>
        <Method onNav={onNav}/>
        <WhyLeadwise/>
        <Stats onNav={onNav}/>
        <LiveProspectView/>
        <FAQ/>
        <Footer onNav={onNav}/>
      </>}
      {page === "stack"    && <StackPage    onNav={onNav}/>}
      {page === "signals"  && <SignalsPage  onNav={onNav}/>}
      {page === "outbound" && <OutboundPage onNav={onNav}/>}
      {page === "intel"    && <IntelPage    onNav={onNav}/>}
      {page === "about"    && <AboutPage    onNav={onNav}/>}
      {page === "contact"  && <ContactPage  onNav={onNav}/>}
      {page === "terms"    && <TermsPage    onNav={onNav}/>}
      {page === "privacy"  && <PrivacyPage  onNav={onNav}/>}
      <TweaksPanel t={t} set={set}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("app"));
root.render(<App/>);
</script>
